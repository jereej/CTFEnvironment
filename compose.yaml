services:
  baguette_frontend:
    image: jereej/ctfenvironment-client
    networks:
      - app-net
    volumes:
      - frontend_build:/frontend_build

  baguette_backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DJANGO_ALLOWED_HOSTS=${PUBLIC_IP}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - DATABASE_URL=postgres://app:app@postgres:5432/app
    networks:
      - app-net
    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    ports:
      - "80:80"               # Single public entry point
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - baguette_frontend
      - baguette_backend
    networks:
      - app-net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data/
    networks:
      - app-net

networks:
  app-net: {}

volumes:
  frontend_build:
  pgdata:
