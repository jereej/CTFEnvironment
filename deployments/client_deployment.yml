apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-env-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctf-env-client
  template:
    metadata:
      labels:
        app: ctf-env-client
    spec:
      containers:
      - name: ctf-env-client
        image: jereej/ctfenvironment-client:latest
        env:
          - name: VITE_SERVER_URL
            value: "http://ctf-env-server-service"
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-env-client-service
spec:
  selector:
    app: ctf-env-client
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5173